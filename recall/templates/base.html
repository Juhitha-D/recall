<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Recall{% endblock %} · Recall</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('main.index') }}"><span class="logo">R</span>Recall</a>
  {% if g.user %}
  <div class="nav-links">
    <a href="{{ url_for('main.dashboard') }}">Decks</a>
    <a href="{{ url_for('main.study') }}" class="btn small">Study all</a>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="link" title="{{ g.user.email }}">Log out</button>
    </form>
  </div>
  {% endif %}
</nav>
<main class="{% block main_class %}{% endblock %}">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
